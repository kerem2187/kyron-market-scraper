name: CI

on:
  push:
    branches: [main, "hardening/**", "fix/ci-production-isolation"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHEETS_SYNC_ENABLED: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"
      - name: Unit tests and build (no production credentials)
        run: gradle --no-daemon test build
      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7
