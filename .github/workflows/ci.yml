name: CI

on:
  push:
    branches: [main, "hardening/**", "fix/ci-production-isolation"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SHEETS_SYNC_ENABLED: "false"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@07d1f8453baaff67fb503883367f8b13e6158a54 # v6
        with:
          gradle-version: "8.10"
      - name: Unit tests and build (no production credentials)
        run: gradle --no-daemon test build
      - name: Preserve unit test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7 (Node 24)
        with:
          name: unit-test-results-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/test-results/test/*.xml
          if-no-files-found: warn
          retention-days: 7
