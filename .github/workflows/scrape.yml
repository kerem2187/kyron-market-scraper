name: Kyron Market Scrape

on:
  workflow_dispatch:
    inputs:
      chains:
        description: "Comma-separated source slugs; 'all' means verified sources only"
        default: "off"
        required: true
      max_minutes:
        description: "Application run-time budget in minutes (Macrocenter: 1-30)"
        default: "10"
        required: true
      max_products:
        description: "Macrocenter product attempt limit (includes failures)"
        default: "30"
        required: true
      max_writes:
        description: "Hard Firestore write budget"
        default: "500"
        required: true

permissions:
  contents: read

concurrency:
  group: kyron-market-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: ${{ contains(github.event.inputs.chains, 'macrocenter') && 20 || 240 }}
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      FIRESTORE_COLLECTION: products
      FIRESTORE_OBSERVATIONS_COLLECTION: product_observations
      FIRESTORE_DATABASE: ${{ vars.FIRESTORE_DATABASE || '(default)' }}
      SHEETS_SYNC_ENABLED: "true"
      SHEETS_SPREADSHEET_ID: "14XFkaUr4nfxfv85Xwp5KyIhFC-1ZxZiUqzqBPTtvxBY"
      SHEETS_CATALOG_TAB: "KATALOG"
      REQUEST_DELAY_MS: "1000"
      MAX_WRITES_PER_RUN: ${{ github.event.inputs.max_writes }}
      MAX_RUN_MINUTES: ${{ github.event.inputs.max_minutes || '10' }}
      MACROCENTER_MAX_RUN_MINUTES: ${{ github.event.inputs.max_minutes || '10' }}
      MACROCENTER_MAX_PRODUCTS: ${{ github.event.inputs.max_products || '30' }}
      MACROCENTER_MAX_LISTING_PAGES: "3"
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      ENABLED_CHAINS: ${{ github.event.inputs.chains }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"
      - name: Validate required secrets
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo "GCP_PROJECT_ID is missing"; exit 1; }
          test -n "$GCP_SA_KEY" || { echo "GCP_SA_KEY is missing"; exit 1; }
          printf '%s' "$GCP_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Test
        run: gradle --no-daemon test
      - name: Install Chromium
        if: contains(github.event.inputs.chains, 'migros') || contains(github.event.inputs.chains, 'carrefoursa') || contains(github.event.inputs.chains, 'macrocenter')
        run: gradle --no-daemon installBrowsers
      - name: Run scraper
        run: gradle --no-daemon run --args="$ENABLED_CHAINS"
      - name: Cleanup credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
