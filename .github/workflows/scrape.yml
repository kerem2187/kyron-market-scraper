name: Kyron Market Scrape

on:
  schedule:
    # 00:00 UTC = 03:00 Europe/Istanbul. GitHub may delay scheduled starts.
    - cron: "0 0 * * *"
  workflow_dispatch:
    inputs:
      chains:
        description: "Comma-separated source slugs; 'all' means verified sources only"
        default: "macrocenter,migros,carrefoursa,sok,a101,file,hakmar,off"
        required: true
      seed_urls:
        description: "Optional Macrocenter category/list URLs, comma-separated; blank discovers categories"
        default: "https://www.macrocenter.com.tr/macropicks-l-8d03038"
        required: false
      max_minutes:
        description: "Run-time budget PER SOURCE in minutes (1-10)"
        default: "10"
        required: true
      max_products:
        description: "Macrocenter product attempt limit (includes failures)"
        default: "30"
        required: true
      max_writes:
        description: "Firestore write budget PER SOURCE"
        default: "500"
        required: true

permissions:
  contents: read

concurrency:
  group: kyron-market-scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      FIRESTORE_COLLECTION: products
      FIRESTORE_OBSERVATIONS_COLLECTION: product_observations
      FIRESTORE_DATABASE: ${{ vars.FIRESTORE_DATABASE || '(default)' }}
      SHEETS_SYNC_ENABLED: "false"
      SHEETS_SPREADSHEET_ID: "14XFkaUr4nfxfv85Xwp5KyIhFC-1ZxZiUqzqBPTtvxBY"
      SHEETS_CATALOG_TAB: "KATALOG"
      REQUEST_DELAY_MS: "3000"
      MAX_WRITES_PER_RUN: ${{ github.event.inputs.max_writes || '500' }}
      MAX_RUN_MINUTES: ${{ github.event.inputs.max_minutes || '10' }}
      MACROCENTER_MAX_RUN_MINUTES: ${{ github.event.inputs.max_minutes || '10' }}
      MACROCENTER_MAX_PRODUCTS: ${{ github.event.inputs.max_products || '30' }}
      MACROCENTER_MAX_LISTING_PAGES: "3"
      MACROCENTER_SEED_URLS: ${{ github.event_name == 'schedule' && 'https://www.macrocenter.com.tr/macropicks-l-8d03038' || github.event.inputs.seed_urls }}
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      ENABLED_CHAINS: ${{ github.event.inputs.chains || 'macrocenter,migros,carrefoursa,sok,a101,file,hakmar,off' }}
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.10"
      - name: Validate required secrets
        id: credentials
        shell: bash
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo "GCP_PROJECT_ID is missing"; exit 1; }
          test -n "$GCP_SA_KEY" || { echo "GCP_SA_KEY is missing"; exit 1; }
          printf '%s' "$GCP_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Test
        run: gradle --no-daemon test
      - name: Install Chromium
        if: contains(env.ENABLED_CHAINS, 'migros') || contains(env.ENABLED_CHAINS, 'carrefoursa') || contains(env.ENABLED_CHAINS, 'macrocenter') || contains(env.ENABLED_CHAINS, 'all')
        run: gradle --no-daemon installBrowsers
      - name: Run scraper (isolated source budgets)
        id: scrape
        run: bash .github/scripts/run-sources.sh
      - name: Sync Firestore catalog to Sheets after scraping
        if: ${{ always() && !cancelled() && steps.credentials.outcome == 'success' && steps.scrape.outcome != 'skipped' }}
        run: gradle --no-daemon syncSheetsCatalog
      - name: Cleanup credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
