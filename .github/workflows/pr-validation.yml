name: PR Validation and Firestore Smoke

on:
  push:
    branches: ["hardening/**"]

permissions:
  contents: read
  pull-requests: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Test and build
        id: build
        run: gradle --no-daemon test build
      - name: Report validation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.build.outcome }}
        run: gh pr comment 1 --body "Automated test/build result: **$RESULT**. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

  firestore-smoke:
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
      FIRESTORE_COLLECTION: products
      FIRESTORE_OBSERVATIONS_COLLECTION: product_observations
      FIRESTORE_DATABASE: ${{ vars.FIRESTORE_DATABASE || '(default)' }}
      ENABLED_CHAINS: off
      REQUEST_DELAY_MS: "1000"
      MAX_WRITES_PER_RUN: "20"
      MAX_RUN_MINUTES: "15"
      GOOGLE_APPLICATION_CREDENTIALS: ${{ github.workspace }}/gcp-key.json
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10"
      - name: Validate and write credentials
        env:
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
        run: |
          test -n "$GCP_PROJECT_ID" || { echo "GCP_PROJECT_ID secret is missing"; exit 1; }
          test -n "$GCP_SA_KEY" || { echo "GCP_SA_KEY secret is missing"; exit 1; }
          printf '%s' "$GCP_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
          chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
      - name: Run limited OFF smoke
        id: smoke
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon run --args="off" 2>&1 | tee smoke.log
      - name: Report smoke
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RESULT: ${{ steps.smoke.outcome }}
        run: |
          SUMMARY="$(grep -E 'SUMMARY|TOTAL written' smoke.log 2>/dev/null | tail -n 4 | tr '\n' ' ' | sed 's/`//g')"
          gh pr comment 1 --body "Limited Firestore smoke result: **$RESULT**. ${SUMMARY:-No product summary produced.} Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
      - name: Cleanup credentials
        if: always()
        run: rm -f "$GOOGLE_APPLICATION_CREDENTIALS"
