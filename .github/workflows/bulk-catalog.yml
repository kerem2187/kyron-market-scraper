name: Bulk Catalog Candidates (Read Only)

on:
  push:
    branches: [main]
    paths: ['tools/bulk_catalog/**', '.github/workflows/bulk-catalog.yml']
  pull_request:
    paths: ['tools/bulk_catalog/**', '.github/workflows/bulk-catalog.yml']
  workflow_dispatch:
    inputs:
      collect:
        description: 'Read public sites. Stop if access is denied; never publish to KATALOG.'
        type: boolean
        default: false
      products:
        description: 'Maximum product attempts per market, not guaranteed barcode yield'
        type: choice
        options: ['10', '100', '500', '1000', '1500']
        default: '1000'
      minutes:
        description: 'Maximum runtime per market'
        type: choice
        options: ['10', '30', '80', '110']
        default: '110'

permissions:
  contents: read

concurrency:
  group: bulk-catalog-${{ github.ref }}
  cancel-in-progress: false

jobs:
  unit-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Credential-free unit tests
        working-directory: tools/bulk_catalog
        run: python3 -m unittest -v
  collect:
    if: github.event_name == 'workflow_dispatch' && inputs.collect
    needs: unit-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source: [migros, macrocenter]
    env:
      SOURCE: ${{ matrix.source }}
      PRODUCT_LIMIT: ${{ inputs.products }}
      MINUTE_LIMIT: ${{ inputs.minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Install free pinned dependencies
        run: |
          python3 -m venv .bulk-venv
          .bulk-venv/bin/pip install -r tools/bulk_catalog/requirements.txt
          .bulk-venv/bin/python -m playwright install --with-deps chromium
      - name: Restore public checkpoint (no credentials)
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bulk-output/${{ matrix.source }}
          key: bulk-v1-${{ github.ref_name }}-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: bulk-v1-${{ github.ref_name }}-${{ matrix.source }}-
      - name: Collect candidates only; no database or Sheet writes
        run: |
          .bulk-venv/bin/python tools/bulk_catalog/bulk_catalog.py \
            --source "$SOURCE" --out "bulk-output/$SOURCE" \
            --limit "$PRODUCT_LIMIT" --minutes "$MINUTE_LIMIT"
      - name: Preserve checkpoint even after a controlled failure
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: bulk-output/${{ matrix.source }}
          key: bulk-v1-${{ github.ref_name }}-${{ matrix.source }}-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Reviewable exports and checkpoint, never publish
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: bulk-catalog-${{ matrix.source }}-${{ github.run_id }}
          path: bulk-output/${{ matrix.source }}/
          if-no-files-found: warn
          retention-days: 14
