name: Catalog Java and credentials setup
description: Prepare Java/Gradle and a temporary service-account file without printing secrets.
inputs:
  project-id:
    required: true
    description: Google Cloud project ID
  service-account-key:
    required: true
    description: Google service-account JSON
runs:
  using: composite
  steps:
    - uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: "21"
    - uses: gradle/actions/setup-gradle@v6
      with:
        gradle-version: "8.10"
    - name: Validate and write temporary credentials
      shell: bash
      env:
        GCP_SA_KEY: ${{ inputs.service-account-key }}
        PROJECT_ID: ${{ inputs.project-id }}
      run: |
        test -n "$PROJECT_ID" || { echo "GCP_PROJECT_ID is missing"; exit 1; }
        test -n "$GCP_SA_KEY" || { echo "GCP_SA_KEY is missing"; exit 1; }
        printf '%s' "$GCP_SA_KEY" > "$GOOGLE_APPLICATION_CREDENTIALS"
        chmod 600 "$GOOGLE_APPLICATION_CREDENTIALS"
